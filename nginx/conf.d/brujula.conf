# ──────────────────────────────────────────────
# API Server (api.brujula.app)
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.brujula.app;

    # SSL
    ssl_certificate /etc/letsencrypt/live/brujula.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brujula.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # API
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Rate limiting for auth endpoints
    location /auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}

# ──────────────────────────────────────────────
# Web Server (brujula.app)
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name brujula.app www.brujula.app;

    # SSL
    ssl_certificate /etc/letsencrypt/live/brujula.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brujula.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Next.js
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets cache
    location /_next/static {
        proxy_pass http://web:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ──────────────────────────────────────────────
# HTTP → HTTPS redirect
# ──────────────────────────────────────────────
server {
    listen 80;
    server_name brujula.app www.brujula.app api.brujula.app;
    return 301 https://$host$request_uri;
}

# ──────────────────────────────────────────────
# Certbot challenge
# ──────────────────────────────────────────────
server {
    listen 80;
    server_name brujula.app www.brujula.app api.brujula.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
