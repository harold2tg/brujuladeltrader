[tool.poetry]
name = "brujula-api"
version = "0.1.0"
description = "La Brújula del Trader - Backend API"
authors = ["Harold Torres Gallo"]
readme = "AGENTS.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pydantic = {extras = ["email"], version = "^2.0.0"}
pydantic-settings = "^2.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^4.1.0"
redis = {extras = ["hiredis"], version = "^5.0.0"}
python-multipart = "^0.0.9"
greenlet = "^3.5.1"
pytz = "^2024.1"
aiofiles = "^23.2.1"
pandas = "^2.2.0"
weasyprint = "^62.0"
jinja2 = "^3.1.0"
anthropic = ">=0.39.0"
openai = ">=1.50.0"
celery = {extras = ["redis"], version = ">=5.3.0"}
google-generativeai = ">=0.8.0"
httpx = ">=0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
asyncio_mode = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
