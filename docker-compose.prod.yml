version: "3.9"

services:
  # ──────────────────────────────────────────────
  # API (FastAPI)
  # ──────────────────────────────────────────────
  api:
    build:
      context: ../Bakend-bdt
      dockerfile: docker/Dockerfile
    container_name: brujula_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - brujula_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────────
  # Worker (Celery)
  # ──────────────────────────────────────────────
  worker:
    build:
      context: ../Bakend-bdt
      dockerfile: docker/Dockerfile
    container_name: brujula_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.worker worker --loglevel=warning --concurrency=4
    networks:
      - brujula_net

  # ──────────────────────────────────────────────
  # Web (Next.js)
  # ──────────────────────────────────────────────
  web:
    build:
      context: ../frontend-bdt
      dockerfile: Dockerfile
    container_name: brujula_web
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - brujula_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: brujula_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - brujula_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: brujula_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - brujula_net

  # ──────────────────────────────────────────────
  # Nginx (Reverse Proxy + SSL)
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: brujula_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    networks:
      - brujula_net

  # ──────────────────────────────────────────────
  # Certbot (SSL Auto-renewal)
  # ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: brujula_certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  brujula_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_data:
  certbot_www:
