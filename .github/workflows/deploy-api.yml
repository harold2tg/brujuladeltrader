name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "Bakend-bdt/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev

permissions:
  contents: read
  id-token: write
  storage: write

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  AR_REPO: brujula
  SERVICE_NAME: brujula-api

jobs:
  build-and-deploy:
    name: Build & Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "latest=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/api:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/api:dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "latest=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        run: |
          docker build \
            -f Bakend-bdt/docker/Dockerfile \
            -t ${{ steps.tag.outputs.tag }} \
            -t ${{ steps.tag.outputs.latest }} \
            Bakend-bdt/

          docker push ${{ steps.tag.outputs.tag }}
          if [[ -n "${{ steps.tag.outputs.latest }}" ]]; then
            docker push ${{ steps.tag.outputs.latest }}
          fi

      - name: Deploy to Cloud Run
        run: |
          ENV="${{ inputs.environment || 'prod' }}"
          SERVICE="${{ env.SERVICE_NAME }}-${ENV}"

          gcloud run deploy "$SERVICE" \
            --image "${{ steps.tag.outputs.tag }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --port 8000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 300 \
            --add-cloudsql-instances "${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:brujula-${ENV}" \
            --vpc-connector "brujula-connector-${ENV}" \
            --set-secrets="JWT_SECRET_KEY=brujula-jwt-secret-key-${ENV}:latest,ENCRYPTION_KEY=brujula-encryption-key-${ENV}:latest,ANTHROPIC_API_KEY=brujula-anthropic-api-key-${ENV}:latest" \
            --set-env-vars="APP_ENV=${ENV},STORAGE_TYPE=gcs,GCS_BUCKET=brujula-uploads-${ENV},DATABASE_URL=postgresql+asyncpg://brujula@//cloudsql/${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:brujula-${ENV}/brujula_db,DATABASE_URL_SYNC=postgresql://brujula@//cloudsql/${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:brujula-${ENV}/brujula_db,REDIS_URL=redis://10.0.0.2:6379/0,CORS_ORIGINS=https://brujula.app,https://www.brujula.app" \
            --no-traffic

      - name: Smoke test (no traffic routing yet)
        run: |
          ENV="${{ inputs.environment || 'prod' }}"
          SERVICE="${{ env.SERVICE_NAME }}-${ENV }}"
          URL=$(gcloud run services describe "$SERVICE" --region "${{ env.GCP_REGION }}" --format="value(status.url)")

          echo "Smoke testing: $URL/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" --max-time 10)
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "❌ Health check failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Health check passed"

      - name: Route traffic to new revision
        if: github.ref == 'refs/heads/main'
        run: |
          ENV="${{ inputs.environment || 'prod' }}"
          SERVICE="${{ env.SERVICE_NAME }}-${ENV}"

          gcloud run services update-traffic "$SERVICE" \
            --region "${{ env.GCP_REGION }}" \
            --to-latest

          echo "✅ Traffic routed to latest revision"

      - name: Verify production endpoint
        if: github.ref == 'refs/heads/main'
        run: |
          ENV="${{ inputs.environment || 'prod' }}"
          SERVICE="${{ env.SERVICE_NAME }}-${ENV}"
          URL=$(gcloud run services describe "$SERVICE" --region "${{ env.GCP_REGION }}" --format="value(status.url)")

          echo "Production URL: $URL"
          curl -s "$URL/health" | jq .
