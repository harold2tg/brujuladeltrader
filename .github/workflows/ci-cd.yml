name: CI/CD Pipeline

on:
  push:
    branches: [ main, developer ]
  pull_request:
    branches: [ main, developer ]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/brujula-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/brujula-web

jobs:
  # ──────────────────────────────────────────────
  # Test Backend
  # ──────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: brujula
          POSTGRES_PASSWORD: brujula_test
          POSTGRES_DB: brujula_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Bakend-bdt/requirements.txt'

      - name: Install dependencies
        working-directory: ./Bakend-bdt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ./Bakend-bdt
        env:
          DATABASE_URL: postgresql+asyncpg://brujula:brujula_test@localhost:5432/brujula_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: test_secret_key_for_ci
          APP_SECRET_KEY: test_app_secret_key
          ENCRYPTION_KEY: test_encryption_key_32_chars_long
        run: |
          pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./Bakend-bdt/coverage.xml

  # ──────────────────────────────────────────────
  # Test Frontend
  # ──────────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-bdt/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend-bdt
        run: npm ci

      - name: Run linter
        working-directory: ./frontend-bdt
        run: npm run lint

      - name: Build
        working-directory: ./frontend-bdt
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ──────────────────────────────────────────────
  # Build & Push API Image
  # ──────────────────────────────────────────────
  build-api:
    name: Build & Push API
    needs: test-backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./Bakend-bdt
          file: ./Bakend-bdt/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Build & Push Web Image
  # ──────────────────────────────────────────────
  build-web:
    name: Build & Push Web
    needs: test-frontend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-bdt
          file: ./frontend-bdt/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Deploy to Homelab
  # ──────────────────────────────────────────────
  deploy-homelab:
    name: Deploy to Homelab
    needs: [build-api, build-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: homelab

    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMELAB_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOMELAB_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.HOMELAB_USER }}@${{ secrets.HOMELAB_HOST }} << 'ENDSSH'
            cd /data/brujula
            docker compose -f docker-compose.homelab.yml pull
            docker compose -f docker-compose.homelab.yml up -d
            docker compose -f docker-compose.homelab.yml exec -T api alembic upgrade head
            docker image prune -f
          ENDSSH

      - name: Verify deployment
        run: |
          sleep 10
          ssh ${{ secrets.HOMELAB_USER }}@${{ secrets.HOMELAB_HOST }} << 'ENDSSH'
            cd /data/brujula
            docker compose -f docker-compose.homelab.yml ps
            docker compose -f docker-compose.homelab.yml exec -T api curl -f http://localhost:8000/health
          ENDSSH
