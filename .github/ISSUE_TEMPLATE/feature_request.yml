name: "✨ Feature Request"
description: Suggest a new feature or improvement for La Brújula del Trader
title: "[FEATURE] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Request
        Thanks for suggesting an improvement! Please describe your idea clearly.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What pain point are you experiencing?
      placeholder: |
        I often struggle with...
        It would be helpful if...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: |
        I'd like to be able to...
        The feature would work by...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: |
        I've tried...
        Another option could be...
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app would this affect?
      options:
        - Chart / Analysis
        - AI Assistant
        - Alerts & Notifications
        - Journal / Notes
        - Account / Billing
        - Mobile App
        - Web Dashboard
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - "🔴 Must have — Can't use the app without it"
        - "🟠 Important — Would significantly improve my workflow"
        - "🟡 Nice to have — Would be convenient"
        - "🟢 Optional — Just an idea"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where would you like to see this feature?
      multiple: true
      options:
        - Web
        - iOS
        - Android
        - All platforms
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups or Examples
      description: Share any sketches, screenshots, or examples of similar features
      placeholder: |
        Here's a rough sketch of what I'm thinking...
        Similar to how [other app] does it...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Anything else you'd like to share?
      placeholder: |
        This came up when I was trying to...
        Related to issue #...
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        *Thank you for your suggestion! We'll review and respond soon.*
